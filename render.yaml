services:
  - type: web
    name: pricefunc-api
    runtime: node
    buildCommand: npm ci --include=dev && npm run build:api && npm prune --omit=dev
    startCommand: npm run release:api && npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false
